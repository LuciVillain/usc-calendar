name: Update USC calendar

on:
  schedule:
    - cron: "0 5 * * *"   # daily at 05:00 UTC (~06:00/07:00 Berlin)
  workflow_dispatch:       # allow manual run from the Actions tab

permissions:
  contents: write          # needed so the workflow can commit usc.ics back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated calendar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usc.ics debug/sample.html || true
          git diff --cached --quiet || git commit -m "Update USC calendar $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
